<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SlimUp — Acompanhamento personalizado para sua transformação</title>
  <meta name="description" content="Conheça os protocolos e o acompanhamento personalizado da SlimUp.">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f1e7}
    iframe{display:block;width:100%;height:100%;height:100dvh;border:0;background:#f6f1e7}
  </style>
</head>
<body>
  <iframe id="slimup-site" src="slimup-base.html" title="Site SlimUp"></iframe>
  <script>
    (function(){
      var frame=document.getElementById('slimup-site');
      frame.addEventListener('load',function(){
        var doc=frame.contentDocument;
        var prices=['R$ 699,00','R$ 999,00','R$ 1.599,00','R$ 2.999,00'];
        doc.querySelectorAll('#plans .plan .pr').forEach(function(price,index){
          if(prices[index]) price.textContent=prices[index];
        });
        var style=doc.createElement('style');
        style.textContent='.p-d{position:relative;border:2px solid rgba(255,253,247,.9);animation:masterPulse 2.35s ease-in-out infinite}.p-d::before{content:"MAIS COMPLETO";position:absolute;top:17px;right:17px;padding:6px 10px;border-radius:100px;background:#FFFDF7;color:#C85B12;font-size:9px;font-weight:700;letter-spacing:.1em;box-shadow:0 8px 20px rgba(115,48,5,.2)}.p-d .tg{padding-right:104px}@keyframes masterPulse{0%,100%{transform:translateY(0);box-shadow:0 18px 40px rgba(224,112,28,.32),0 0 0 0 rgba(247,148,56,.28)}50%{transform:translateY(-5px);box-shadow:0 26px 52px rgba(224,112,28,.46),0 0 0 9px rgba(247,148,56,0)}}@media(prefers-reduced-motion:reduce){.p-d{animation:none!important}}';
        doc.head.appendChild(style);
        var palette=doc.createElement('style');
        palette.textContent='.hero,.marquee+.sec,#protocolos{background:#fff!important}#resultados{background:#eef7ff!important}';
        doc.head.appendChild(palette);
        doc.querySelectorAll('a.wa').forEach(function(link){
          link.href=link.href.replace(/phone=\d+/,'phone=5551998545166');
        });
      });
    })();
  </script>
</body>
</html>
