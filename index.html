<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SlimUp ou Hyallune</title>
  <meta name="description" content="Escolha entre os protocolos SlimUp e o atendimento profissional da Hyallune.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#3676b8;--deep:#173a5e;--gold:#d9b86f;--ink:#111f2d;--muted:#607083}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff}
    body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .entry{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;min-height:100dvh}
    .choice{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(38px,6vw,90px)}
    .choice:before,.choice:after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
    .slim{background:linear-gradient(145deg,#fffdf7 0%,#eef6fd 55%,#d9eafa 100%);color:var(--ink)}
    .slim:before{width:520px;height:520px;right:-230px;top:-250px;border:1px solid rgba(54,118,184,.2);box-shadow:0 0 0 70px rgba(54,118,184,.045),0 0 0 140px rgba(54,118,184,.025)}
    .slim:after{width:330px;height:330px;left:-190px;bottom:-200px;background:radial-gradient(circle,rgba(217,164,0,.2),rgba(217,164,0,0) 68%)}
    .aurea{background:linear-gradient(145deg,#19191b 0%,#080809 66%,#000 100%);color:#fff}
    .aurea:before{width:470px;height:470px;left:-200px;top:-230px;border:1px solid rgba(217,184,111,.22);box-shadow:0 0 0 68px rgba(217,184,111,.035),0 0 0 136px rgba(217,184,111,.02)}
    .aurea:after{width:390px;height:390px;right:-210px;bottom:-230px;background:radial-gradient(circle,rgba(217,184,111,.19),rgba(217,184,111,0) 68%)}
    .content{position:relative;z-index:1;width:min(100%,560px)}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:24px;font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    .brand:before{content:"";width:32px;height:2px;border-radius:2px;background:currentColor}
    .slim .brand{color:var(--blue)}
    .aurea .brand{color:var(--gold)}
    h1{margin:0;font-family:"Cormorant Garamond",serif;font-size:clamp(2.7rem,4.7vw,4.9rem);font-weight:600;line-height:.98;letter-spacing:-.035em;text-wrap:balance}
    .aurea h1{font-family:"Montserrat",sans-serif;font-size:clamp(2.2rem,4vw,4.1rem);font-weight:600;line-height:1.03;letter-spacing:-.045em}
    p{margin:24px 0 34px;font-size:clamp(.94rem,1.15vw,1.08rem);line-height:1.6;letter-spacing:.01em}
    .slim p{color:var(--muted)}
    .aurea p{color:rgba(255,255,255,.67)}
    .cta{display:inline-flex;align-items:center;justify-content:space-between;gap:22px;width:min(100%,340px);min-height:60px;padding:10px 12px 10px 24px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.045em;transition:transform .2s ease;animation:pulseBlue 2.2s ease-in-out infinite}
    .cta:hover{transform:translateY(-3px) scale(1.01)}
    .cta:focus-visible{outline:3px solid currentColor;outline-offset:5px}
    .slim .cta{background:linear-gradient(150deg,var(--blue),var(--deep));color:#fff}
    .aurea .cta{background:#fff;color:#0b0b0c;animation-name:pulseGold}
    .arrow{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.18);font-size:1.2rem}
    .aurea .arrow{background:#0b0b0c;color:var(--gold)}
    @keyframes pulseBlue{0%,100%{box-shadow:0 14px 32px rgba(23,58,94,.24)}50%{box-shadow:0 18px 44px rgba(23,58,94,.44),0 0 0 9px rgba(54,118,184,.09)}}
    @keyframes pulseGold{0%,100%{box-shadow:0 14px 32px rgba(0,0,0,.38)}50%{box-shadow:0 18px 44px rgba(0,0,0,.54),0 0 0 9px rgba(217,184,111,.12)}}
    @media(max-width:820px){
      .entry{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
      .choice{justify-content:flex-start;padding:clamp(24px,6vw,42px) 28px}
      .content{max-width:560px;margin:auto}
      .brand{margin-bottom:12px;font-size:.67rem}
      h1,.aurea h1{font-size:clamp(1.78rem,8vw,2.7rem);line-height:1.02}
      p{margin:11px 0 17px;font-size:.83rem;line-height:1.45}
      .cta{width:100%;min-height:52px;font-size:.73rem}
    }
    @media(max-width:820px) and (max-height:700px){
      .choice{padding:18px 22px}.brand{margin-bottom:8px}h1,.aurea h1{font-size:1.65rem}p{margin:8px 0 12px}.cta{min-height:48px}
    }
    @media(prefers-reduced-motion:reduce){.cta{animation:none}}
  </style>
</head>
<body>
  <main class="entry" aria-label="Escolha como deseja continuar">
    <section class="choice slim">
      <div class="content">
        <span class="brand">SlimUp</span>
        <h1>Quero transformar meu corpo</h1>
        <p>Protocolos • acompanhamento • nutrição • treino</p>
        <a class="cta" href="slimup.html">Conheça a SlimUp <span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </section>
    <section class="choice aurea">
      <div class="content">
        <span class="brand">Hyallune</span>
        <h1>Sou profissional da saúde/estética</h1>
        <p>Toxinas • preenchedores • resinas • atendimento comercial</p>
        <a class="cta" href="https://edgcreativeco.github.io/aurea-supply-medical/">Conheça a Hyallune <span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
</body>
</html>
